<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client previews - Plinth</title>
<style>
  :root { --paper: #f4ead7; --ink: #1b1610; --muted: #6b5d4d; --accent: #bd3d24; --line: #d7c8b1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.6; }
  .wrap { width: min(920px, 100%); margin: 0 auto; padding: 56px 24px; }
  .bar { background: var(--ink); color: var(--paper); text-align: center; padding: 8px 16px; font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .035em; }
  h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: clamp(2.8rem, 7vw, 5rem); font-weight: 400; line-height: .95; letter-spacing: -.04em; }
  .intro { max-width: 56ch; margin: 0 0 36px; color: var(--muted); }
  .card { display: block; padding: 24px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); text-decoration: none; }
  .card h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 400; line-height: 1.1; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card span { display: inline-block; margin-top: 14px; border-bottom: 1px solid var(--accent); color: var(--accent); font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .card:hover h2 { color: var(--accent); }
  .foot { margin-top: 28px; color: var(--muted); font-family: ui-monospace, monospace; font-size: 10px; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="bar">Internal review page &middot; Not indexed</div>
<main class="wrap">
  <h1>Client previews</h1>
  <p class="intro">One pilot is published for review. The remaining 21 previews are held until the direction is approved.</p>
  <a class="card" href="the-centre-for-better-grooves/">
    <h2>The Centre For Better Grooves</h2>
    <p>Record shop &middot; Gloucester Road, Bristol</p>
    <span>Open preview</span>
  </a>
  <p class="foot">Prepared by Plinth &middot; <a href="../">Template gallery</a></p>
</main>
</body>
</html>
